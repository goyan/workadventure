# Installation commune aux jobs de `pr-checks` : Node, protoc, dépendances (play, back, messages) et fichiers générés
# (messages protobuf, types i18n). Les `node_modules` sont mis en cache par empreinte des lockfiles : `npm ci` ne tourne
# que lorsqu'elles changent.
name: Préparer play
description: Node, protoc, dépendances en cache, messages protobuf et types i18n générés.

inputs:
  repo-token:
    description: Jeton GitHub en lecture, pour télécharger protoc sans limite de débit.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24

    - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        repo-token: ${{ inputs.repo-token }}
        version: "3.x"

    - name: Cache des dépendances
      id: node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          */node_modules
          libs/*/node_modules
          play/packages/*/node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'messages/package-lock.json') }}

    - name: Dépendances
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        npm ci --workspace=workadventure-play --workspace=workadventureback
        (cd messages && npm ci)

    - name: Génération des messages protobuf
      shell: bash
      run: npm run ts-proto
      working-directory: messages

    - name: Fichiers i18n
      shell: bash
      run: npm run typesafe-i18n
      working-directory: play
