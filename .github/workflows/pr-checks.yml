# Vérifications d'une pull request vers `infogene` (play, back et contrats partagés).
# Reprend les étapes de l'ancien « Continuous Integration Play » d'upstream : types, svelte-check, lint, formatage, tests.
#
# Trois jobs en parallèle (types et formats, lint, tests), résumés par le contrôle exigé « Contrôles play », partagent l'installation `.github/actions/setup-play`
# (`node_modules` en cache). Le lint garde un cache ESLint entre les exécutions : seuls les fichiers modifiés sont relus.
# Les exécutions sur `infogene` (après fusion) remplissent ces caches : une PR ne peut lire que ceux de sa branche de base.
# Limite du cache ESLint : les règles typées d'un fichier inchangé ne sont pas réévaluées quand un type importé change ;
# l'exécution sur `infogene`, qui repart du dernier cache, rattrape ces cas au plus tard après fusion.
#
# SÉCURITÉ : repo public. Déclencheurs `pull_request` et `push` sur `infogene` uniquement (jamais
# `pull_request_target`) : le jeton est en lecture seule et aucun secret n'est exposé aux PR venant de forks. Actions
# épinglées par SHA.
name: pr-checks

on:
  pull_request:
    branches: [infogene]
  push:
    branches: [infogene]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  types:
    name: Types et formats play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-play

      - name: Complétude des traductions
        run: npm run i18n:check
        working-directory: play

      - name: Typecheck
        run: npm run typecheck
        working-directory: play

      - name: Svelte check
        run: npm run svelte-check
        working-directory: play

      - name: Formatage
        run: npm run pretty-check
        working-directory: play

      - name: Typecheck back et contrats partagés
        run: |
          npm run typecheck --workspace=workadventureback
          npm run typecheck --workspace=@workadventure/shared-utils

      - name: Lint et formatage back
        run: |
          npx eslint src/Model/PrivateMessages.ts src/Model/GameRoom.ts src/Services/SocketManager.ts tests/PrivateMessages.test.ts tests/GameRoom.test.ts tests/SocketManagerPrivateMessages.test.ts
          npx prettier --check src/Model/PrivateMessages.ts src/Model/GameRoom.ts src/Services/SocketManager.ts tests/PrivateMessages.test.ts tests/GameRoom.test.ts tests/SocketManagerPrivateMessages.test.ts
        working-directory: back

      - name: Lint et formatage des contrats
        run: |
          npx eslint src/Events/TextMessages.ts src/index.ts
          npx prettier --check src/Events/TextMessages.ts src/index.ts
        working-directory: libs/shared-utils

      - name: Tests back
        run: npm test -- --run
        working-directory: back

  lint:
    name: Lint play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-play

      # Clé : configuration et dépendances (un changement invalide tout), plus l'exécution (chaque exécution enregistre
      # son cache) ; la restauration reprend le plus récent de même configuration.
      - name: Cache ESLint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: play/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'play/eslint.config.js', 'libs/eslint-config/**', 'play/tsconfig.json') }}-${{ github.run_id }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'play/eslint.config.js', 'libs/eslint-config/**', 'play/tsconfig.json') }}-

      - name: Lint
        run: npm run lint -- --cache --cache-strategy content --cache-location .eslintcache
        working-directory: play

  tests:
    name: Tests play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-play

      - name: Tests unitaires
        run: npm test -- --run
        working-directory: play

  # Seul contrôle exigé par la protection de `infogene` : vert seulement si les trois jobs le sont.
  checks:
    name: Contrôles play
    if: always()
    needs: [types, lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Résultat des trois jobs
        run: |
          echo "types=${{ needs.types.result }} lint=${{ needs.lint.result }} tests=${{ needs.tests.result }}"
          test "${{ needs.types.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.tests.result }}" = success
