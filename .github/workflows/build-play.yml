# Build de l'image `play` du fork Infogène et publication sur GHCR.
#
# SÉCURITÉ : ce repo est public, donc ce workflow ne contient AUCUN secret de déploiement.
#  - il n'écrit que sur ghcr.io/goyan/* via le GITHUB_TOKEN éphémère du job ;
#  - pas de déclencheur pull_request / pull_request_target (aucun code externe n'y tourne) ;
#  - actions épinglées par SHA de commit ;
#  - le déploiement est TIRÉ par le VPS (cf. repo goyan/workadventure-selfhost, dossier deploy/).
#
# Tags produits :
#  - push sur `infogene`            -> :beta et :sha-<7 car.>   (la beta les déploie automatiquement)
#  - tag git `vX.Y.Z-infogene.N`    -> :vX.Y.Z-infogene.N       (release, promue en prod par prod.tag)
name: build-play

on:
  push:
    branches: [infogene]
    tags: ["v*-infogene.*"]

concurrency:
  group: build-play-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: github.repository == 'goyan/workadventure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/goyan/workadventure-play
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - id: tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "list=${IMAGE}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${IMAGE}:beta,${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: play/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/goyan/workadventure
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/goyan/workadventure-play:buildcache
          cache-to: type=registry,ref=ghcr.io/goyan/workadventure-play:buildcache,mode=max
